<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin sign in · WebClaw</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
      font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .panel {
      width: min(100%, 400px);
      padding: 32px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(15 23 42 / 8%);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .brand strong { display: block; font-size: 17px; }
    .brand span { color: #64748b; font-size: 13px; }
    h1 { margin: 0 0 6px; font-size: 23px; letter-spacing: -.03em; }
    .intro { margin: 0 0 24px; color: #64748b; }
    label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      font: inherit;
    }
    input:focus { outline: 3px solid rgb(225 29 72 / 14%); border-color: #e11d48; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #e11d48;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .65; }
    #message { min-height: 22px; margin: 14px 0 0; color: #b91c1c; font-size: 13px; }
    #message.info { color: #475569; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <img src="/static/img/logomark.png" alt="">
      <div><strong>WebClaw</strong><span>Administrator dashboard</span></div>
    </div>
    <h1>Sign in</h1>
    <p class="intro">Enter your administrator credentials to continue.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required maxlength="128">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
      <button id="submit" type="submit">Sign in</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const message = document.getElementById('message');
    const button = document.getElementById('submit');
    const showMessage = (text, isInfo = false) => {
      message.textContent = text;
      message.classList.toggle('info', isInfo);
    };

    fetch('/api/auth/status')
      .then(response => response.json())
      .then(status => {
        if (!status.configured) {
          document.querySelectorAll('#login-form input, #login-form button')
            .forEach(control => { control.disabled = true; });
          showMessage(`${status.configuration_error} Restart the Gateway after updating gateway/.env.`);
        } else if (new URLSearchParams(location.search).has('setup')) {
          showMessage('Configure the admin credentials before opening the dashboard.');
        }
      })
      .catch(() => showMessage('Could not check Gateway authentication status. Make sure the Gateway is running.'));

    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      showMessage('');
      const form = new FormData(event.currentTarget);
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.get('username'),
            password: form.get('password')
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Sign-in failed.');
        location.replace('/dashboard/');
      } catch (error) {
        showMessage(error instanceof Error ? error.message : 'Sign-in failed.');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
