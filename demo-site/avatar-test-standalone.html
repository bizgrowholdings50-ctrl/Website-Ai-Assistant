<!DOCTYPE html>
<html>
<head>
  <title>WebClaw Elite AI Avatar Test</title>
  <style>
    body {
      background: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      gap: 24px;
      color: #f8fafc;
    }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.025em; color: #e2e8f0; }
    .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .preview { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .preview span { font-size: 12px; color: #94a3b8; font-weight: 500; }
    canvas { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
    .round canvas { border-radius: 50%; }
    .square canvas { border-radius: 20px; }
  </style>
</head>
<body>
  <h1>WebClaw Elite AI Avatar Test</h1>

  <div class="row">
    <div class="preview round">
      <span>FAB Size (64px)</span>
      <canvas id="c1" width="128" height="128" style="width:64px;height:64px;"></canvas>
    </div>
    <div class="preview round">
      <span>Header Size (36px)</span>
      <canvas id="c2" width="72" height="72" style="width:36px;height:36px;"></canvas>
    </div>
    <div class="preview round">
      <span>Standard (128px)</span>
      <canvas id="c3" width="128" height="128"></canvas>
    </div>
  </div>

  <div class="row">
    <div class="preview square">
      <span>Elite Navy Theme</span>
      <canvas id="c4" width="200" height="200" style="width:140px;height:140px;"></canvas>
    </div>
    <div class="preview square">
      <span>Cyber Teal Theme</span>
      <canvas id="c5" width="200" height="200" style="width:140px;height:140px;"></canvas>
    </div>
    <div class="preview square">
      <span>Royal Purple Theme</span>
      <canvas id="c6" width="200" height="200" style="width:140px;height:140px;"></canvas>
    </div>
  </div>

  <script>
    function hexToRgb(hex) {
      const num = parseInt(hex.replace('#', ''), 16);
      return [(num >> 16) & 0xFF, (num >> 8) & 0xFF, num & 0xFF];
    }
    function darken(hex, amt) {
      const [r, g, b] = hexToRgb(hex);
      return `rgb(${Math.max(0, r - Math.round(255*amt))}, ${Math.max(0, g - Math.round(255*amt))}, ${Math.max(0, b - Math.round(255*amt))})`;
    }
    function lighten(hex, amt) {
      const [r, g, b] = hexToRgb(hex);
      return `rgb(${Math.min(255, r + Math.round(255*amt))}, ${Math.min(255, g + Math.round(255*amt))}, ${Math.min(255, b + Math.round(255*amt))})`;
    }

    function drawEliteAvatar(canvasId, opts) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const s = canvas.width;
      const color = opts.color || '#3b82f6';

      let pulsePhase = 0;
      let scanlineOffset = 0;

      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        ctx.clearRect(0, 0, s, s);

        pulsePhase += 0.04;
        scanlineOffset = (scanlineOffset + 1.5) % s;
        const hoverY = Math.sin(now * 0.0025) * (s * 0.02);

        // Outer Ambient Glow Aura
        const aura = ctx.createRadialGradient(s/2, s/2 + hoverY, s * 0.1, s/2, s/2 + hoverY, s * 0.45);
        aura.addColorStop(0, color);
        aura.addColorStop(0.6, 'rgba(59, 130, 246, 0.1)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.fillRect(0, 0, s, s);

        const cx = s / 2;
        const cy = (s / 2) + hoverY;
        const coreW = s * 0.52;
        const coreH = s * 0.64;

        // Outer Metallic Shield Ring / Chassis
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cx - coreW/2, cy - coreH/2, coreW, coreH, [coreW * 0.38]);
        
        const chassisGrad = ctx.createLinearGradient(cx - coreW/2, cy - coreH/2, cx + coreW/2, cy + coreH/2);
        chassisGrad.addColorStop(0, lighten(color, 0.3));
        chassisGrad.addColorStop(0.3, color);
        chassisGrad.addColorStop(0.7, darken(color, 0.4));
        chassisGrad.addColorStop(1, '#090d16');
        ctx.fillStyle = chassisGrad;
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.lineWidth = s * 0.025;
        ctx.strokeStyle = lighten(color, 0.4);
        ctx.stroke();
        ctx.restore();

        // Inner Visor Screen (Dark Glass Effect)
        const visorW = coreW * 0.76;
        const visorH = coreH * 0.48;
        const visorY = cy - coreH * 0.06;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cx - visorW/2, visorY - visorH/2, visorW, visorH, [visorW * 0.3]);
        ctx.fillStyle = '#030712';
        ctx.shadowBlur = 0;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.stroke();
        ctx.clip();

        // Glowing Core / Neural Wave / Eyes inside Visor
        const coreGlow = ctx.createRadialGradient(cx, visorY, 2, cx, visorY, visorW * 0.5);
        coreGlow.addColorStop(0, lighten(color, 0.5));
        coreGlow.addColorStop(0.7, color);
        coreGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = coreGlow;
        ctx.fillRect(cx - visorW, visorY - visorH, visorW * 2, visorH * 2);

        // Futuristic Audio Visualizer Wave Line inside Visor
        ctx.beginPath();
        ctx.moveTo(cx - visorW * 0.35, visorY);
        for (let x = -visorW * 0.35; x <= visorW * 0.35; x += 4) {
          const wave = Math.sin(x * 0.15 + now * 0.01) * (visorH * 0.22) * Math.sin(pulsePhase);
          ctx.lineTo(cx + x, visorY + wave);
        }
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.stroke();

        ctx.restore();

        // Top Antenna Node
        ctx.beginPath();
        ctx.arc(cx, cy - coreH/2 - s * 0.06, s * 0.035, 0, Math.PI * 2);
        ctx.fillStyle = lighten(color, 0.5);
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fill();

        // Antenna Stem
        ctx.beginPath();
        ctx.moveTo(cx, cy - coreH/2);
        ctx.lineTo(cx, cy - coreH/2 - s * 0.04);
        ctx.lineWidth = s * 0.012;
        ctx.strokeStyle = lighten(color, 0.2);
        ctx.stroke();

        // Subtle Glass Highlight Reflection on the body
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cx - coreW/2, cy - coreH/2, coreW, coreH * 0.4, [coreW * 0.38, coreW * 0.38, 0, 0]);
        const gloss = ctx.createLinearGradient(cx, cy - coreH/2, cx, cy);
        gloss.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
        gloss.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = gloss;
        ctx.fill();
        ctx.restore();
      }

      animate();
    }

    drawEliteAvatar('c1', { color: '#3b82f6' }); // Blue
    drawEliteAvatar('c2', { color: '#3b82f6' }); // Blue
    drawEliteAvatar('c3', { color: '#3b82f6' }); // Blue
    drawEliteAvatar('c4', { color: '#0f172a' }); // Deep Navy / Slate
    drawEliteAvatar('c5', { color: '#06b6d4' }); // Cyber Teal
    drawEliteAvatar('c6', { color: '#8b5cf6' }); // Royal Purple
  </script>
</body>
</html>
